name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: shellcheck tvlink install.sh tests/*.sh
      - run: python3 tvlink-power test
      - run: python3 tvlink-agent test
