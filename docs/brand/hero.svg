<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="tvlink: a TV showing a board full screen with a live status badge, driven by a Raspberry Pi 5 over HDMI" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>tvlink: set-and-forget signage for consumer TVs</title>
<defs>
<radialGradient id="wall" cx="0.7" cy="0.42" r="0.6"><stop offset="0" stop-color="#1A2029"/><stop offset="1" stop-color="#0E1116"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
<path id="blade" d="M736 511C744 504 748 498 748 492" fill="none" stroke="#2A3340" stroke-width="4" stroke-linecap="round"/>
</defs>
<rect width="1280" height="640" fill="url(#wall)"/>

<!-- copy -->
<g transform="translate(72 116) scale(.72)"><rect x="7" y="10" width="160" height="90" rx="16" fill="none" stroke="#F4F6F8" stroke-width="14"/><circle cx="141" cy="74" r="12" fill="#2FD07A"/><g transform="translate(214 0)"><g fill="none" stroke="#F4F6F8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path d="M24 15V82A18 18 0 0 0 42 100M8 40H44"/><path d="M68 40L98 100L128 40"/><path d="M154 10V100"/><path d="M182 40V100"/><path d="M210 40V100M210 70A30 30 0 0 1 270 70V100"/><path d="M298 10V100M338 40L298 75M310 64.5L340 100"/></g><circle cx="182" cy="14" r="8" fill="#F4F6F8"/></g></g>
<g fill="#F4F6F8" font-size="42" font-weight="650"><text x="72" y="284">Set-and-forget signage</text><text x="72" y="334">for consumer TVs</text></g>
<g fill="#9AA4B2" font-size="24"><text x="100" y="412">Any web page or slideshow, full screen</text><text x="100" y="452">Back on its own after a power cut</text><text x="100" y="492">TV on and off over HDMI-CEC</text><text x="100" y="532">Self-healing, managed remotely</text></g>
<g fill="#4A5563"><rect x="74" y="398" width="10" height="10" rx="2"/><rect x="74" y="438" width="10" height="10" rx="2"/><rect x="74" y="478" width="10" height="10" rx="2"/><rect x="74" y="518" width="10" height="10" rx="2"/></g>

<g transform="translate(0 -8)">
<!-- cable, behind TV -->
<path d="M762 452C762 430 800 432 806 400" fill="none" stroke="#3A4452" stroke-width="7" stroke-linecap="round"/>
<text x="822" y="442" fill="#9AA4B2" font-size="22">HDMI-CEC</text>

<!-- TV -->
<rect x="606" y="70" width="610" height="350" rx="12" fill="#000" opacity=".55" filter="url(#soft)"/>
<rect x="596" y="48" width="620" height="358" rx="10" fill="#262E39"/>
<rect x="604" y="56" width="604" height="340" rx="3" fill="#12161C"/>
<!-- board -->
<text x="624" y="94" font-weight="650" fill="#F4F6F8" font-size="24">Today</text>
<text x="1188" y="94" text-anchor="end" fill="#9AA4B2" font-size="24">09:41</text>
<path d="M620 110H1192" stroke="#262E39" stroke-width="2"/>
<g fill="#1C232C"><rect x="620" y="124" width="180" height="214" rx="8"/><rect x="812" y="124" width="200" height="214" rx="8"/><rect x="1024" y="124" width="168" height="214" rx="8"/></g>
<g fill="#F4F6F8" font-size="22" font-weight="650"><text x="636" y="156">Status</text><text x="828" y="156">Roster</text><text x="1040" y="156">Week</text></g>
<g fill="#F4F6F8" font-size="46" font-weight="700"><text x="636" y="218">12</text><text x="636" y="298">3</text></g>
<g fill="#9AA4B2" font-size="22"><text x="636" y="244">Open</text><text x="636" y="324">Waiting</text></g>
<g fill="#2A3340"><circle cx="836" cy="186" r="9"/><circle cx="836" cy="216" r="9"/><circle cx="836" cy="246" r="9"/><circle cx="836" cy="276" r="9"/><circle cx="836" cy="306" r="9"/></g>
<g fill="#3A4452"><rect x="854" y="181" width="104" height="10" rx="5"/><rect x="854" y="211" width="84" height="10" rx="5"/><rect x="854" y="241" width="116" height="10" rx="5"/><rect x="854" y="271" width="72" height="10" rx="5"/><rect x="854" y="301" width="96" height="10" rx="5"/></g>
<g fill="#3A4452"><rect x="1040" y="262" width="14" height="52" rx="3"/><rect x="1060" y="236" width="14" height="78" rx="3"/><rect x="1080" y="250" width="14" height="64" rx="3"/><rect x="1100" y="214" width="14" height="100" rx="3"/><rect x="1120" y="228" width="14" height="86" rx="3"/><rect x="1140" y="246" width="14" height="68" rx="3"/></g>
<rect x="1160" y="196" width="14" height="118" rx="3" fill="#9AA4B2"/>
<path d="M1036 322H1180" stroke="#2A3340" stroke-width="2"/>
<!-- status badge, as tvlink-agent draws it -->
<rect x="1036" y="350" width="160" height="36" rx="18" fill="#0E1116" opacity=".85"/>
<circle cx="1056" cy="368" r="7" fill="#2FD07A"/>
<text x="1072" y="376" fill="#F4F6F8" font-size="22">Wi-Fi 09:41</text>
<!-- screen sheen -->
<path d="M604 56H860L700 396H604Z" fill="#F4F6F8" opacity=".025"/>

<!-- badge callout -->
<path d="M1116 386V470" stroke="#9AA4B2" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="1116" cy="470" r="4" fill="#9AA4B2"/>
<g text-anchor="end"><text x="1216" y="512" fill="#F4F6F8" font-size="26" font-weight="650">Live Badge</text><text x="1216" y="544" fill="#9AA4B2" font-size="22">Board answered 09:41</text></g>

<!-- Raspberry Pi 5, HDMI edge up: HDMI1, HDMI0 (cable), USB-C; Ethernet by the HDMI edge -->
<rect x="640" y="468" width="176" height="116" rx="10" fill="#1F2630" stroke="#3A4452" stroke-width="2"/>
<g fill="#2A3340" stroke="#3A4452" stroke-width="2"><rect x="622" y="476" width="44" height="30" rx="3"/><rect x="626" y="514" width="40" height="28" rx="3"/><rect x="626" y="550" width="40" height="28" rx="3"/></g>
<path d="M630 492h20M632 528h18M632 564h18" stroke="#0E1116" stroke-width="6"/>
<g fill="#0E1116"><circle cx="806" cy="478" r="4"/><circle cx="806" cy="574" r="4"/><circle cx="686" cy="478" r="4"/><circle cx="686" cy="574" r="4"/></g>
<g fill="#3A4452"><rect x="728" y="462" width="16" height="8" rx="2"/><rect x="784" y="462" width="16" height="8" rx="2"/></g>
<rect x="750" y="444" width="24" height="24" rx="4" fill="#3A4452"/>
<rect x="698" y="482" width="76" height="76" rx="8" fill="#2A3340"/>
<circle cx="736" cy="520" r="31" fill="#161B22"/>
<use xlink:href="#blade"/><use xlink:href="#blade" transform="rotate(60 736 520)"/><use xlink:href="#blade" transform="rotate(120 736 520)"/><use xlink:href="#blade" transform="rotate(180 736 520)"/><use xlink:href="#blade" transform="rotate(240 736 520)"/><use xlink:href="#blade" transform="rotate(300 736 520)"/>
<circle cx="736" cy="520" r="10" fill="#3A4452"/>
<rect x="784" y="498" width="22" height="22" rx="2" fill="#2A3340"/>
<rect x="680" y="566" width="112" height="12" rx="2" fill="#161B22"/>
<path d="M684 569.5H790M684 574.5H790" stroke="#9AA4B2" stroke-width="3" stroke-dasharray="2.6 2.7"/>
<text x="728" y="616" text-anchor="middle" fill="#F4F6F8" font-size="24" font-weight="650">Raspberry Pi 5</text>
</g>
</svg>
